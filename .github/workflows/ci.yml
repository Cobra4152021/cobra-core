name: ci

on:
  push:
    branches: [master, main, "kc-*"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

      - name: Typecheck
        run: mypy src/cobra_core

      - name: Tests
        run: pytest

      - name: Protocol conformance
        run: cobra-protocol-conformance

      - name: Build sdist + wheel
        run: python -m build

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/cobra-wheel-venv
          /tmp/cobra-wheel-venv/bin/pip install dist/*.whl
          /tmp/cobra-wheel-venv/bin/python -c "import cobra_core; from importlib.metadata import version; print(version('cobra-core'))"
