# KC-016 — Build & deploy Cobra Core staging on Cloudflare Containers.
# Docker runs ONLY on GitHub-hosted runners — not on developer laptops.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — Account API token (Workers Scripts Edit + Containers + Account read)
#   COBRA_CORE_AUTH_SECRET — Bearer secret shared with Cobra Computer staging
#
# Optional KC-021 live-provider secrets (staging only; never commit values):
#   OPENAI_API_KEY         — OpenAI-compatible API key (Wrangler secret)
# Optional non-secret vars are set in wrangler.cobra-core-staging.jsonc
# (CIAL_LIVE_PROVIDER_ENABLED defaults to false).
#
# Trigger: Actions → "Deploy Cobra Core Staging (Cloudflare Containers)" → Run workflow

name: Deploy Cobra Core Staging (Cloudflare Containers)

on:
  workflow_dispatch:
    inputs:
      air_enabled:
        description: "AIR_ENABLED"
        required: false
        default: "true"
      isf_enabled:
        description: "ISF_ENABLED"
        required: false
        default: "true"
      rrf_enabled:
        description: "RRF_ENABLED"
        required: false
        default: "true"
      cial_profile:
        description: "CIAL_PROFILE"
        required: false
        default: "default"
      cial_live_provider_enabled:
        description: "CIAL_LIVE_PROVIDER_ENABLED"
        required: false
        default: "false"
      air_exclude_providers:
        description: "AIR_EXCLUDE_PROVIDERS (comma-separated)"
        required: false
        default: ""
      container_instance_suffix:
        description: "Bump container DO name suffix (forces fresh envVars)"
        required: false
        default: "kc026a"
  push:
    branches: [kc-016-staging-deploy]
    paths:
      - "Dockerfile.cobra-core-staging"
      - "wrangler.cobra-core-staging.jsonc"
      - "deploy/cloudflare-containers/**"
      - "deploy/staging-rc1/staging_edge.py"
      - "src/cobra_core/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-cobra-core-staging.yml"

concurrency:
  group: cobra-core-staging-deploy
  cancel-in-progress: false

env:
  CERTIFIED_TAG: v0.9.0-rc1
  IMAGE_NAME: cobra-core-staging
  # Account ID from wrangler whoami (Cobra4152020)
  CF_ACCOUNT_ID: ef3a70f5368245d987e2f2bb4a351b4a

jobs:
  build-and-deploy:
    name: Cloud build + staging deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin certified Core sources note
        run: |
          echo "Deploy packaging branch may sit atop RC1; Protocol V1 pin is enforced at runtime."
          echo "Certified revision: ec400d83a9cc8105557bda2105f177cc619638b2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare-containers/package-lock.json

      - name: Install Worker deps
        working-directory: deploy/cloudflare-containers
        run: npm ci

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Unique tag per commit — same :v0.9.0-rc1 tag was not rolling containers to new digests.
      - name: Resolve image tag
        id: image
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          IMAGE_TAG="${CERTIFIED_TAG}-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "registry.cloudflare.com/${CF_ACCOUNT_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build image (GitHub runner Docker — not local)
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.cobra-core-staging \
            -t "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            .

      - name: Push image to Cloudflare Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler containers push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            -c wrangler.cobra-core-staging.jsonc

      # Bind secrets BEFORE deploy so Container DO envVars capture them on boot.
      # (Container envVars are frozen at DO construction; post-deploy secret put
      # alone does not reload an already-running container instance.)
      - name: Ensure Core auth secret is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COBRA_CORE_AUTH_SECRET: ${{ secrets.COBRA_CORE_AUTH_SECRET }}
        run: |
          if [ -z "$COBRA_CORE_AUTH_SECRET" ]; then
            echo "COBRA_CORE_AUTH_SECRET repo secret is required" >&2
            exit 1
          fi
          printf '%s' "$COBRA_CORE_AUTH_SECRET" | npx wrangler secret put COBRA_CORE_AUTH_SECRET \
            -c wrangler.cobra-core-staging.jsonc

      - name: Optional OpenAI-compatible secret (KC-021)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — live provider remains unavailable (mock default)."
            exit 0
          fi
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY \
            -c wrangler.cobra-core-staging.jsonc
          echo "OPENAI_API_KEY secret bound (value not logged)."

      - name: Apply KC-026 staging gate vars (workflow_dispatch inputs)
        if: github.event_name == 'workflow_dispatch'
        env:
          AIR_ENABLED: ${{ inputs.air_enabled }}
          ISF_ENABLED: ${{ inputs.isf_enabled }}
          RRF_ENABLED: ${{ inputs.rrf_enabled }}
          CIAL_PROFILE: ${{ inputs.cial_profile }}
          CIAL_LIVE_PROVIDER_ENABLED: ${{ inputs.cial_live_provider_enabled }}
          AIR_EXCLUDE_PROVIDERS: ${{ inputs.air_exclude_providers }}
          CONTAINER_SUFFIX: ${{ inputs.container_instance_suffix }}
        run: |
          python3 <<'PY'
          import os, pathlib, re
          path = pathlib.Path("wrangler.cobra-core-staging.jsonc")
          text = path.read_text(encoding="utf-8")

          def set_var(src: str, key: str, value: str) -> str:
              pat = rf'("{key}"\s*:\s*")[^"]*(")'
              patched, n = re.subn(pat, rf"\g<1>{value}\g<2>", src, count=1)
              if n != 1:
                  raise SystemExit(f"failed to patch var {key} (n={n})")
              return patched

          text = set_var(text, "AIR_ENABLED", os.environ.get("AIR_ENABLED") or "true")
          text = set_var(text, "ISF_ENABLED", os.environ.get("ISF_ENABLED") or "true")
          text = set_var(text, "RRF_ENABLED", os.environ.get("RRF_ENABLED") or "true")
          text = set_var(text, "CIAL_PROFILE", os.environ.get("CIAL_PROFILE") or "default")
          text = set_var(
              text,
              "CIAL_LIVE_PROVIDER_ENABLED",
              os.environ.get("CIAL_LIVE_PROVIDER_ENABLED") or "false",
          )
          text = set_var(
              text,
              "AIR_EXCLUDE_PROVIDERS",
              os.environ.get("AIR_EXCLUDE_PROVIDERS") or "",
          )
          path.write_text(text, encoding="utf-8")
          print(
              "vars:",
              "AIR_ENABLED=", os.environ.get("AIR_ENABLED"),
              "ISF_ENABLED=", os.environ.get("ISF_ENABLED"),
              "RRF_ENABLED=", os.environ.get("RRF_ENABLED"),
              "CIAL_PROFILE=", os.environ.get("CIAL_PROFILE"),
              "CIAL_LIVE=", os.environ.get("CIAL_LIVE_PROVIDER_ENABLED"),
              "AIR_EXCLUDE=", os.environ.get("AIR_EXCLUDE_PROVIDERS") or "(none)",
          )
          idx = pathlib.Path("deploy/cloudflare-containers/src/index.ts")
          src = idx.read_text(encoding="utf-8")
          suffix = (os.environ.get("CONTAINER_SUFFIX") or "kc026a").strip()
          patched, n = re.subn(
              r'(getContainer\(env\.COBRA_CORE_CONTAINER,\s*")[^"]*("\))',
              rf"\g<1>staging-rc1-{suffix}\g<2>",
              src,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"failed to patch container name (n={n})")
          idx.write_text(patched, encoding="utf-8")
          print(f"container instance -> staging-rc1-{suffix}")
          PY

      - name: Point wrangler at this commit's image tag
        run: |
          IMAGE_REF="registry.cloudflare.com/${CF_ACCOUNT_ID}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("wrangler.cobra-core-staging.jsonc")
          text = path.read_text(encoding="utf-8")
          # Strip // comments for a safe patch of the image field only.
          image_ref = os.environ["IMAGE_REF"]
          patched, n = re.subn(
              r'("image"\s*:\s*")[^"]*(")',
              rf'\g<1>{image_ref}\g<2>',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"failed to patch image field (replacements={n})")
          path.write_text(patched, encoding="utf-8")
          print(f"wrangler image -> {image_ref}")
          PY
        env:
          IMAGE_REF: registry.cloudflare.com/${{ env.CF_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

      - name: Deploy Worker (uses pre-built registry image)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy -c wrangler.cobra-core-staging.jsonc

      - name: Print staging URL hint
        run: |
          echo "Staging Worker: cobra-core-staging"
          echo "Expected URL: https://cobra-core-staging.<subdomain>.workers.dev"
          echo "Image: registry.cloudflare.com/${CF_ACCOUNT_ID}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          echo "CIAL_LIVE_PROVIDER_ENABLED default: false (opt-in via wrangler vars after approval)"

      # KC-021: secret-safe provider probe (no keys/prompts/message text in logs).
      - name: KC-021 OpenAI probe (safe metadata)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-5.4-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping live probe."
            exit 0
          fi
          python3 <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ["OPENAI_API_KEY"]
          base = os.environ["OPENAI_BASE_URL"].rstrip("/")
          model = os.environ["OPENAI_MODEL"]

          def call(case: str, payload: dict) -> None:
              req = urllib.request.Request(
                  f"{base}/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      content = ((data.get("choices") or [{}])[0].get("message") or {}).get("content") or ""
                      usage = data.get("usage") or {}
                      print(json.dumps({
                          "case": case,
                          "http": resp.status,
                          "ok": True,
                          "content_len": len(content),
                          "total_tokens": usage.get("total_tokens"),
                      }))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      err = (json.loads(raw).get("error") or {})
                  except json.JSONDecodeError:
                      err = {}
                  print(json.dumps({
                      "case": case,
                      "http": exc.code,
                      "ok": False,
                      "code": err.get("code"),
                      "type": err.get("type"),
                      "param": err.get("param"),
                  }))

          call("max_completion_tokens", {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly one word: pong"}],
              "max_completion_tokens": 32,
              "stream": False,
          })
          call("max_tokens_legacy", {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly one word: pong"}],
              "max_tokens": 32,
              "stream": False,
          })
          call("no_token_limit", {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly one word: pong"}],
              "stream": False,
          })
          PY
